<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <style>
      700&family=JetBrains+Mono:wght@400;600&display=swap');
      .bg { fill: #070b16; }
      .card { fill: #0d1326; stroke: rgba(36, 123, 255, 0.25); stroke-width: 1.5; rx: 16px; }
      .heading { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; fill: #f5f7fb; }
      .chip-bg { fill: #111827; stroke: #247bff; stroke-width: 1; rx: 8px; }
      .chip-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #f5f7fb; font-weight: 600; }
      .cat-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; fill: #ff354f; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="900" height="300" class="bg" rx="16" />
  <rect x="15" y="15" width="870" height="270" class="card" />

  <text x="50" y="55" class="heading">⚡ Technology Stack</text>

  <!-- Backend Category -->
  <g transform="translate(50, 85)">
    <text x="0" y="15" class="cat-title">BACKEND</text>
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="115" height="36" class="chip-bg" /><text x="18" y="23" class="chip-text">PHP</text>
      <rect x="125" y="0" width="115" height="36" class="chip-bg" /><text x="143" y="23" class="chip-text">Laravel</text>
      <rect x="250" y="0" width="115" height="36" class="chip-bg" /><text x="268" y="23" class="chip-text">Python</text>
      <rect x="375" y="0" width="130" height="36" class="chip-bg" /><text x="393" y="23" class="chip-text">REST APIs</text>
    </g>
  </g>

  <!-- Frontend Category -->
  <g transform="translate(50, 165)">
    <text x="0" y="15" class="cat-title">FRONTEND</text>
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="125" height="36" class="chip-bg" /><text x="18" y="23" class="chip-text">JavaScript</text>
      <rect x="135" y="0" width="95" height="36" class="chip-bg" /><text x="153" y="23" class="chip-text">React</text>
      <rect x="240" y="0" width="115" height="36" class="chip-bg" /><text x="258" y="23" class="chip-text">Inertia.js</text>
      <rect x="365" y="0" width="110" height="36" class="chip-bg" /><text x="383" y="23" class="chip-text">Tailwind</text>
    </g>
  </g>

  <!-- Database & Tools Category -->
  <g transform="translate(590, 85)">
    <text x="0" y="15" class="cat-title">DATABASE & TOOLS</text>
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="110" height="36" class="chip-bg" /><text x="18" y="23" class="chip-text">MySQL</text>
      <rect x="120" y="0" width="130" height="36" class="chip-bg" /><text x="138" y="23" class="chip-text">PostgreSQL</text>
    </g>
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="80" height="36" class="chip-bg" /><text x="18" y="23" class="chip-text">Git</text>
      <rect x="90" y="0" width="100" height="36" class="chip-bg" /><text x="108" y="23" class="chip-text">GitHub</text>
      <rect x="200" y="0" width="60" height="36" class="chip-bg" /><text x="218" y="23" class="chip-text">VS</text>
    </g>
  </g>
</svg>