<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <style>
      700&family=JetBrains+Mono:wght@400;600&display=swap');
      .bg { fill: #070b16; }
      .card { fill: #0d1326; stroke: rgba(36, 123, 255, 0.25); stroke-width: 1.5; rx: 16px; }
      .heading { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; fill: #f5f7fb; }
      .body-text { font-family: 'Space Grotesk', sans-serif; font-size: 15px; fill: #94a3b8; }
      .highlight { fill: #247bff; font-weight: 600; }
      .carousel-box { fill: #111827; stroke: #247bff; stroke-width: 1; rx: 12px; }
      .carousel-title { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #f5f7fb; font-weight: 600; }
      
      @keyframes slideFade {
        0% { opacity: 0; transform: translateY(8px); }
        10% { opacity: 1; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(0); }
        40% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(-8px); }
      }
      
      .slide-1 { animation: slideFade 12s infinite 0s; }
      .slide-2 { animation: slideFade 12s infinite 4s; }
      .slide-3 { animation: slideFade 12s infinite 8s; }

      @keyframes progress {
        0% { width: 0%; }
        33% { width: 100%; }
        33.1% { width: 0%; }
        100% { width: 0%; }
      }
      .bar-1 { animation: progress 12s infinite 0s; }
      .bar-2 { animation: progress 12s infinite 4s; }
      .bar-3 { animation: progress 12s infinite 8s; }
    </style>
  </defs>

  <rect width="900" height="260" class="bg" rx="16" />
  <rect x="15" y="15" width="870" height="230" class="card" />

  <g transform="translate(50, 60)">
    <text x="0" y="0" class="heading">💡 About Me</text>
    <text x="0" y="38" class="body-text">I am a self-employed <tspan class="highlight">Full-Stack Developer</tspan> specializing in Laravel,</text>
    <text x="0" y="62" class="body-text">React, and robust <tspan class="highlight">SaaS architecture</tspan>. Dedicated to building</text>
    <text x="0" y="86" class="body-text">efficient solutions like <tspan class="highlight">Staynest</tspan> and <tspan class="highlight">PakAccount</tspan>.</text>
  </g>

  <!-- Carousel Box -->
  <g transform="translate(520, 45)">
    <rect x="0" y="0" width="330" height="170" class="carousel-box" />
    <text x="30" y="35" class="body-text" fill="#ff354f">CORE INTERESTS</text>

    <!-- Slide 1 -->
    <g class="slide-1" transform="translate(30, 75)">
      <text x="0" y="0" class="carousel-title">⚡ Technology</text>
      <text x="0" y="28" class="body-text">Exploring modern web frameworks & cloud systems.</text>
      <rect x="0" y="60" width="270" height="3" fill="#1f2937" rx="1.5" />
      <rect x="0" y="60" height="3" fill="#247bff" rx="1.5" class="bar-1" />
    </g>

    <!-- Slide 2 -->
    <g class="slide-2" transform="translate(30, 75)">
      <text x="0" y="0" class="carousel-title">🧩 Problem Solving</text>
      <text x="0" y="28" class="body-text">Engineering scalable logic for enterprise workflows.</text>
      <rect x="0" y="60" width="270" height="3" fill="#1f2937" rx="1.5" />
      <rect x="0" y="60" height="3" fill="#247bff" rx="1.5" class="bar-2" />
    </g>

    <!-- Slide 3 -->
    <g class="slide-3" transform="translate(30, 75)">
      <text x="0" y="0" class="carousel-title">🤖 Learning AI</text>
      <text x="0" y="28" class="body-text">Integrating intelligent automation into apps.</text>
      <rect x="0" y="60" width="270" height="3" fill="#1f2937" rx="1.5" />
      <rect x="0" y="60" height="3" fill="#247bff" rx="1.5" class="bar-3" />
    </g>
  </g>
</svg>